<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Painel de Vendas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div id="tela-login" class="flex flex-col items-center justify-center h-screen px-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Acesso Restrito 🔒</h2>
            <form onsubmit="event.preventDefault(); fazerLogin();">
                <label class="block text-sm font-medium text-gray-700 mb-1">E-mail Admin</label>
                <input type="email" id="login-email" class="w-full p-3 border rounded mb-4" placeholder="admin@exemplo.com" required>
                <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                <input type="password" id="login-senha" class="w-full p-3 border rounded mb-6" placeholder="******" required>
                <button type="submit" id="btn-login" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700 transition uppercase tracking-wider">Entrar no Painel</button>
            </form>
            <p id="msg-login" class="text-center mt-4 text-sm text-red-500 font-bold"></p>
        </div>
    </div>

    <div id="painel-principal" class="hidden p-6 max-w-7xl mx-auto space-y-8">
        
        <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <h1 class="text-xl font-black text-gray-800 uppercase tracking-tighter">Gerenciar Vendas</h1>
            <div class="flex items-center gap-4">
                <span class="hidden md:inline text-sm text-gray-400">Admin: <strong id="user-email" class="text-gray-600">...</strong></span>
                <button onclick="sair()" class="text-red-500 hover:bg-red-50 px-4 py-2 rounded-lg border border-red-100 font-bold text-xs transition-all uppercase">Sair</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 md:col-span-1 h-[520px] flex flex-col">
                <h2 class="text-green-600 font-black mb-4 uppercase text-xs tracking-widest flex items-center gap-2">
                    <i data-lucide="user-plus" class="w-4 h-4"></i> 1. Selecionar Cliente
                </h2>
                <input type="text" id="busca-cliente" placeholder="Filtrar por nome ou e-mail..." class="w-full p-3 border rounded-lg mb-4 text-sm outline-none focus:ring-2 focus:ring-green-500/20" onkeyup="filtrarClientes()">
                <div id="lista-clientes" class="space-y-2 overflow-y-auto flex-1 pr-1 custom-scroll">
                    <p class="text-gray-400 text-center py-10 italic">Carregando lista...</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 md:col-span-2 space-y-6">
                <h2 class="text-green-600 font-black uppercase text-xs tracking-widest flex items-center gap-2">
                    <i data-lucide="file-text" class="w-4 h-4"></i> 2. Dados da Cobrança
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Cliente Ativo</label>
                        <input type="text" id="cliente-nome" class="w-full p-3 bg-gray-50 border rounded-lg text-gray-900 font-bold text-sm" disabled placeholder="Selecione na lista ←">
                        <input type="hidden" id="cliente-id">
                        <input type="hidden" id="cliente-email-real">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Valor da Venda (R$)</label>
                        <input type="text" id="campo-valor" class="w-full p-3 border rounded-lg font-black text-gray-800 text-lg focus:ring-2 focus:ring-green-500/20 outline-none" placeholder="Ex: 500.00">
                    </div>
                </div>

                <div class="space-y-1">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Produto ou Serviço</label>
                        <button onclick="abrirModalProduto()" class="text-[10px] font-bold text-blue-500 hover:text-blue-700 flex items-center gap-1 transition-colors bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded">
                            <i data-lucide="plus" class="w-3 h-3"></i> Adicionar Novo
                        </button>
                    </div>
                    <select id="select-produto" class="w-full p-3 border rounded-lg bg-white font-medium text-sm outline-none focus:ring-2 focus:ring-green-500/20" onchange="aoMudarProduto()">
                        <option value="">Selecione um produto...</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Pix Copia e Cola (Opcional)</label>
                    <textarea id="pix-manual" rows="3" class="w-full p-3 border rounded-lg font-mono text-[10px] bg-gray-50 outline-none focus:ring-2 focus:ring-green-500/20" placeholder="Cole o código Pix gerado pelo banco aqui..."></textarea>
                </div>

                <button onclick="lancarPedido()" id="btn-lancar" class="w-full bg-green-500 hover:bg-green-600 text-white font-black py-4 rounded-xl transition-all shadow-lg shadow-green-200 uppercase tracking-widest">
                    Lançar Venda Oficial
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                <h2 class="text-blue-600 font-black uppercase text-xs tracking-widest flex items-center gap-2">
                    <i data-lucide="shopping-cart" class="w-4 h-4"></i> Gerenciar Vendas Lançadas
                </h2>
                <button onclick="carregarVendasPendentes()" class="text-[10px] font-bold text-gray-400 hover:text-blue-600 uppercase tracking-tighter transition-colors">Atualizar Lista</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-50 text-gray-400 uppercase text-[10px] font-black">
                        <tr>
                            <th class="p-4">ID</th>
                            <th class="p-4">Cliente</th>
                            <th class="p-4">Produto</th>
                            <th class="p-4">Valor</th>
                            <th class="p-4 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-vendas" class="divide-y divide-gray-100">
                        <tr><td colspan="5" class="p-10 text-center text-gray-300 italic">Buscando vendas no banco de dados...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-4 mb-10">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 max-h-[500px] overflow-y-auto border-t-4 border-green-500 w-full">
                <div class="flex justify-between items-center mb-6 sticky top-0 bg-white pb-2 border-b z-10">
                    <h2 id="titulo-log-cliente" class="text-green-700 font-black uppercase text-xs tracking-widest flex items-center gap-2">
                        <i data-lucide="activity" class="w-4 h-4"></i> Atividades Recentes (Clientes)
                    </h2>
                    <button onclick="carregarLogsGlobais()" class="text-[10px] font-bold text-gray-400 hover:text-green-600 uppercase transition-all bg-gray-100 px-3 py-1.5 rounded-full">Ver Histórico Geral</button>
                </div>
                <div id="lista-logs-admin" class="relative border-l-2 border-gray-100 ml-4 space-y-6 mt-4 pb-4">
                    <p class="text-sm text-gray-400 pl-4 italic">Buscando passos dos clientes...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-produto" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center fade-in px-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 relative">
            <button onclick="fecharModalProduto()" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 transition-colors bg-gray-50 hover:bg-red-50 p-1.5 rounded-full">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            
            <h3 class="text-lg font-black text-gray-800 mb-6 uppercase tracking-tighter flex items-center gap-2">
                <div class="p-2 bg-blue-50 text-blue-500 rounded-lg"><i data-lucide="package-plus" class="w-5 h-5"></i></div>
                Cadastrar Produto
            </h3>
            
            <div class="space-y-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Nome do Produto</label>
                    <input type="text" id="novo-produto-nome" class="w-full p-3 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 bg-gray-50" placeholder="Ex: PlayStation 5">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Preço Padrão (R$)</label>
                    <input type="number" step="0.01" id="novo-produto-preco" class="w-full p-3 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 bg-gray-50" placeholder="Ex: 3500.00">
                </div>
                
                <button onclick="salvarNovoProduto()" id="btn-salvar-produto" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-black py-4 rounded-xl transition-all shadow-lg shadow-blue-200 uppercase tracking-widest text-xs mt-4">
                    Salvar no Banco
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const supabaseUrl = 'https://eedegpggzooimuvytmyt.supabase.co'
        const supabaseKey = 'sb_publishable_7ib6PE-capYPhqdTrS0m2w_3d9QWE8x'
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey)
        let clienteSelecionadoId = null;

        // --- AUTH ---
        async function verificarLogin() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) { mostrarPainel(session.user); } 
            else { document.getElementById('tela-login').classList.remove('hidden'); }
        }
        function mostrarPainel(user) {
            document.getElementById('tela-login').classList.add('hidden');
            document.getElementById('painel-principal').classList.remove('hidden');
            document.getElementById('user-email').innerText = user.email;
            carregarClientes(); carregarProdutos(); carregarVendasPendentes(); carregarLogsGlobais(); iniciarRealtimeLogs();
        }
        async function fazerLogin() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-senha').value;
            const { error } = await _supabase.auth.signInWithPassword({ email: email, password: pass });
            if (error) { document.getElementById('msg-login').innerText = "Erro: E-mail ou Senha inválidos."; } 
            else { window.location.reload(); }
        }
        async function sair() { await _supabase.auth.signOut(); window.location.reload(); }

        // --- CARREGAMENTOS CLIENTES ---
        async function carregarClientes() {
            const { data } = await _supabase.from('clientes').select('*').order('created_at', { ascending: false });
            const lista = document.getElementById('lista-clientes');
            lista.innerHTML = "";
            if (data) {
                data.forEach(c => {
                    const div = document.createElement('div');
                    div.className = "p-4 border rounded-xl cursor-pointer hover:bg-green-50/50 flex justify-between items-start cliente-item transition-all border-gray-100";
                    div.innerHTML = `<div class="flex flex-col gap-0.5 w-full"><span class="font-bold text-gray-800 text-sm capitalize">${c.nome} ${c.sobrenome || ''}</span><span class="text-[10px] text-gray-400 flex items-center gap-1"><i data-lucide="mail" class="w-3 h-3"></i>${c.email || 'N/A'}</span><span class="text-[10px] text-gray-500 font-bold flex items-center gap-1"><i data-lucide="phone" class="w-3 h-3"></i>${c.telefone || 'N/A'}</span></div>`;
                    div.onclick = () => {
                        document.querySelectorAll('.cliente-item').forEach(x => x.classList.remove('bg-green-100', 'border-green-500', 'ring-1', 'ring-green-500'));
                        div.classList.add('bg-green-100', 'border-green-500', 'ring-1', 'ring-green-500');
                        document.getElementById('cliente-nome').value = (c.nome || '') + " " + (c.sobrenome || '');
                        document.getElementById('cliente-id').value = c.id_auth; 
                        document.getElementById('cliente-email-real').value = c.email || ''; 
                        carregarLogsDoCliente(c.id_auth, c.email || c.nome);
                    };
                    lista.appendChild(div);
                });
                lucide.createIcons();
            }
        }
        function filtrarClientes() {
            const termo = document.getElementById('busca-cliente').value.toLowerCase();
            document.querySelectorAll('.cliente-item').forEach(item => { item.style.display = item.innerText.toLowerCase().includes(termo) ? "flex" : "none"; });
        }

        // --- SISTEMA DE PRODUTOS E NOTIFICAÇÃO ---
        async function carregarProdutos() {
            const { data } = await _supabase.from('produtos').select('*');
            const sel = document.getElementById('select-produto');
            sel.innerHTML = '<option value="">Selecione um produto...</option>'; 
            if(data) { 
                data.forEach(p => { 
                    const opt = document.createElement('option'); 
                    opt.value = p.nome; 
                    opt.setAttribute('data-preco', p.preco);
                    opt.innerText = `${p.nome} - R$ ${p.preco}`; 
                    sel.appendChild(opt); 
                }); 
            }
        }

        function aoMudarProduto() {
            const sel = document.getElementById('select-produto');
            const opSelecionada = sel.options[sel.selectedIndex];
            const preco = opSelecionada.getAttribute('data-preco'); 
            
            if (preco && preco !== "undefined") {
                document.getElementById('campo-valor').value = preco;
            } else {
                document.getElementById('campo-valor').value = ""; 
            }
        }

        function abrirModalProduto() {
            document.getElementById('modal-produto').classList.remove('hidden');
            document.getElementById('novo-produto-nome').focus();
        }

        function fecharModalProduto() {
            document.getElementById('modal-produto').classList.add('hidden');
            document.getElementById('novo-produto-nome').value = '';
            document.getElementById('novo-produto-preco').value = '';
        }

        async function salvarNovoProduto() {
            const nome = document.getElementById('novo-produto-nome').value.trim();
            const precoStr = document.getElementById('novo-produto-preco').value.trim();
            const btn = document.getElementById('btn-salvar-produto');

            if (!nome || !precoStr) {
                alert("Preencha o nome e o preço do produto.");
                return;
            }

            const precoNum = parseFloat(precoStr.replace(',', '.'));
            btn.innerText = "SALVANDO...";
            btn.disabled = true;

            const { error } = await _supabase.from('produtos').insert([{ nome: nome, preco: precoNum }]);

            if (error) {
                alert("Erro ao salvar: " + error.message);
            } else {
                fecharModalProduto();
                carregarProdutos(); // Atualiza a lista na hora
                
                // DISPARO DE E-MAIL AVISANDO DO NOVO PRODUTO
                fetch("https://formsubmit.co/ajax/lucasalvesfariaesilva@gmail.com", {
                    method: "POST",
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        _subject: "🛍️ NOVO PRODUTO ADICIONADO NO SISTEMA!",
                        "Nome do Produto": nome,
                        "Preço Cadastrado": "R$ " + precoNum.toFixed(2).replace('.', ','),
                        "Data do Cadastro": new Date().toLocaleString('pt-BR')
                    })
                }).catch(() => {});
                
                alert("Produto cadastrado com sucesso!");
            }

            btn.innerText = "Salvar no Banco";
            btn.disabled = false;
        }

        // --- LANÇAR PEDIDO ---
        async function lancarPedido() {
            const clienteId = document.getElementById('cliente-id').value;
            const clienteEmail = document.getElementById('cliente-email-real').value;
            const produto = document.getElementById('select-produto').value;
            const valor = document.getElementById('campo-valor').value;
            const pix = document.getElementById('pix-manual').value;
            if (!clienteId || !valor) { alert("Atenção: Selecione um cliente e defina um valor."); return; }
            
            const { error } = await _supabase.from('vendas').insert({ 
                email_cliente: clienteId, 
                produto: produto || "Venda Manual", 
                valor: valor, 
                status: 'Pendente', 
                pix_copia_cola: pix 
            });

            if (!error) {
                alert("Sucesso! Venda lançada no sistema.");
                document.getElementById('pix-manual').value = "";
                carregarVendasPendentes();
                registrarAtividadeAdmin(clienteId, clienteEmail, `Admin gerou cobrança de R$ ${valor} (${produto})`);
            } else {
                alert("Erro ao salvar: " + error.message);
            }
        }

        // --- TABELA DE VENDAS ---
        async function carregarVendasPendentes() {
            const tb = document.getElementById('tabela-vendas');
            const { data } = await _supabase.from('vendas').select('*').in('status', ['Pendente', 'Pago', 'Aprovado']).order('id', { ascending: false });

            if (!data || data.length === 0) { tb.innerHTML = `<tr><td colspan="5" class="p-10 text-center text-gray-400 italic">Nenhuma venda encontrada no histórico.</td></tr>`; return; }

            tb.innerHTML = data.map(v => {
                const isPago = v.status === 'Pago' || v.status === 'Aprovado';
                const rowClass = isPago ? 'bg-gray-50 opacity-60' : 'bg-white hover:bg-green-50/20';
                const valorLimpo = (v.valor && v.valor !== 'null') ? `R$ ${v.valor}` : `<span class="text-red-300">R$ 0,00</span>`;

                return `
                    <tr class="${rowClass} border-b border-gray-100 transition-all">
                        <td class="p-4 font-mono text-[10px] text-gray-400">#${v.id}</td>
                        <td class="p-4 text-[10px] text-gray-500 font-bold">${v.email_cliente ? v.email_cliente.substring(0, 8) + '...' : '---'}</td>
                        <td class="p-4 text-xs ${isPago ? 'line-through text-gray-400' : 'font-bold text-gray-700'}">${v.produto}</td>
                        <td class="p-4 font-black ${isPago ? 'text-gray-400' : 'text-green-600'}">${valorLimpo}</td>
                        <td class="p-4">
                            <div class="flex items-center justify-center gap-2">
                                <button onclick="${isPago ? '' : `aprovarVenda(${v.id}, '${v.email_cliente}')`}" ${isPago ? 'disabled' : ''} class="${isPago ? 'bg-gray-100 text-gray-300' : 'bg-green-100 text-green-700 hover:bg-green-200'} px-3 py-1.5 rounded-lg text-[10px] font-black flex items-center gap-1 uppercase transition-all">
                                    <i data-lucide="check-circle" class="w-3 h-3"></i> ${isPago ? 'Pago' : 'Aprovar'}
                                </button>
                                <button onclick="${isPago ? '' : `atualizarPix(${v.id}, '${v.email_cliente}')`}" ${isPago ? 'disabled' : ''} class="${isPago ? 'bg-gray-100 text-gray-300' : 'bg-blue-100 text-blue-700 hover:bg-blue-200'} px-3 py-1.5 rounded-lg text-[10px] font-black flex items-center gap-1 uppercase transition-all">
                                    <i data-lucide="edit-3" class="w-3 h-3"></i> Pix
                                </button>
                                <button onclick="deletarVenda(${v.id}, '${v.email_cliente}')" class="bg-red-50 text-red-400 hover:bg-red-500 hover:text-white p-2 rounded-lg transition-all">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
            lucide.createIcons();
        }

        async function deletarVenda(id, idAuth) {
            if(confirm("Confirmar exclusão definitiva do pedido #" + id + "?")) {
                const { error } = await _supabase.from('vendas').delete().eq('id', id);
                if(!error) { carregarVendasPendentes(); registrarAtividadeAdmin(idAuth, "Log: " + idAuth, `Admin deletou o pedido #${id}`); }
            }
        }

        async function aprovarVenda(id, idAuth) {
            if(confirm("Deseja marcar o pedido #" + id + " como PAGO?")) {
                const { error } = await _supabase.from('vendas').update({ status: 'Pago' }).eq('id', id);
                if(!error) { carregarVendasPendentes(); registrarAtividadeAdmin(idAuth, "Log: " + idAuth, `Admin aprovou o pedido #${id}`); }
            }
        }

        async function atualizarPix(id, idAuth) {
            const novo = prompt("Cole o novo código Pix Copia e Cola:");
            if(novo) {
                await _supabase.from('vendas').update({ pix_copia_cola: novo }).eq('id', id);
                carregarVendasPendentes();
                registrarAtividadeAdmin(idAuth, "Log: " + idAuth, `Admin atualizou o Pix do pedido #${id}`);
            }
        }

        async function registrarAtividadeAdmin(idCliente, emailCliente, descricaoAcao) {
            try {
                await _supabase.from('logs_atividades').insert([{ id_cliente: idCliente, email_cliente: emailCliente, acao: descricaoAcao }]);
                if(clienteSelecionadoId === idCliente) carregarLogsDoCliente(idCliente, emailCliente);
                else if (!clienteSelecionadoId) carregarLogsGlobais();
            } catch (e) {}
        }

        async function carregarLogsGlobais() {
            clienteSelecionadoId = null;
            document.getElementById('titulo-log-cliente').innerHTML = `<i data-lucide="activity" class="w-4 h-4"></i> Atividades Recentes (Clientes)`;
            const { data, error } = await _supabase.from('logs_atividades').select('*').order('created_at', { ascending: false }).limit(60);
            renderizarLogs(data, error);
        }

        async function carregarLogsDoCliente(idAuth, nomeCliente) {
            clienteSelecionadoId = idAuth;
            document.getElementById('titulo-log-cliente').innerHTML = `<i data-lucide="activity" class="w-4 h-4"></i> Atividades de: ${nomeCliente}`;
            const { data, error } = await _supabase.from('logs_atividades').select('*').eq('id_cliente', idAuth).order('created_at', { ascending: false });
            renderizarLogs(data, error);
        }

        function renderizarLogs(data, error) {
            const container = document.getElementById('lista-logs-admin');
            if (error || !data) { container.innerHTML = '<p class="text-xs text-gray-400 pl-4 italic">Buscando informações...</p>'; return; }
            const filteredData = data.filter(log => log.acao && !log.acao.toLowerCase().includes('admin'));
            if (filteredData.length === 0) { container.innerHTML = '<p class="text-[10px] text-gray-300 pl-4 italic">Nenhuma atividade de cliente registrada.</p>'; return; }
            container.innerHTML = filteredData.map(log => `
                <div class="relative pl-6 fade-in mb-4">
                    <span class="absolute -left-[11px] top-0 bg-white"><i data-lucide="check-circle-2" class="w-5 h-5 text-green-500 fill-white rounded-full shadow-sm"></i></span>
                    <p class="font-bold text-xs text-gray-800">${log.acao}</p>
                    <p class="text-[10px] text-gray-400 mt-0.5">${log.email_cliente || 'Visitante'} • ${new Date(log.created_at).toLocaleString('pt-BR')}</p>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function iniciarRealtimeLogs() {
            _supabase.channel('logs-channel')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'logs_atividades' }, payload => {
                    if (payload.new.acao && payload.new.acao.toLowerCase().includes('admin')) return;
                    if (clienteSelecionadoId && payload.new.id_cliente === clienteSelecionadoId) carregarLogsDoCliente(clienteSelecionadoId, "Atualizando...");
                    else if (!clienteSelecionadoId) carregarLogsGlobais();
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'vendas' }, () => carregarVendasPendentes())
                .subscribe();
        }
        verificarLogin();
    </script>
</body>
</html>
