<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Seguro - Login e Cadastro</title>
    
    <meta property="og:title" content="Acesso Seguro | Crie sua Conta" />
    <meta property="og:description" content="A forma mais fácil e segura de receber pagamentos com infraestrutura de ponta a ponta." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.linkdepag.com/assets/capa-whatsapp.png" />
    <meta property="og:url" content="https://www.linkdepag.com/minha-conta/" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .bg-amarelo { background-color: #F5DE3E; }
        .text-verde { color: #00a38c; }
        .icon-bg { background-color: #d1fae5; color: #0a5f53; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
        .btn-gradiente { background: linear-gradient(135deg, #00a38c 0%, #008e7a 100%); transition: all 0.2s; }
        .btn-gradiente:hover { background: linear-gradient(135deg, #008e7a 0%, #006e5f 100%); }
        .glass { background: rgba(255, 246, 208, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(0, 0, 0, 0.1); width: 100%; max-width: 100%; }
        .input-style { background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(0,0,0,0.15); padding: 12px 12px 12px 40px; border-radius: 0.5rem; width: 100%; outline: none; transition: all 0.2s; font-size: 14px; }
        .input-style:focus { border-color: #00a38c; box-shadow: 0 0 0 2px rgba(0, 163, 140, 0.2); background: rgba(255, 255, 255, 1); }
        .hidden { display: none !important; }
        .auto-filled { animation: highlight 1s ease-out; background-color: #f0fdf4 !important; border-color: #00a38c !important; }
        @keyframes highlight { 0% { background-color: #bbf7d0; } 100% { background-color: rgba(255, 255, 255, 0.7); } }
    </style>
</head>
<body class="bg-amarelo min-h-screen w-full flex flex-col">

    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute inset-0 bg-gradient-to-b from-[#F5DE3E] via-[#FFF3A6] to-white"></div>
    </div>

    <header class="absolute top-6 left-6 lg:top-8 lg:left-12 z-50">
        <img src="../assets/logo.png" alt="Logo" class="w-28 lg:w-40">
    </header>

    <div class="relative z-10 w-full min-h-screen flex flex-col lg:flex-row items-start justify-center px-6 pt-28 pb-10 lg:px-16 lg:pt-36 gap-10 lg:gap-20">
        
        <div class="w-full lg:w-1/2 flex flex-col">
            <div class="mb-4 flex flex-col items-start gap-2">
                <div class="inline-flex items-center gap-2 rounded-full border border-black/10 bg-white/60 px-3 py-1 backdrop-blur shadow-sm">
                    <i data-lucide="shield-check" class="w-4 h-4 text-verde"></i>
                    <span class="text-[10px] font-bold text-black/80 uppercase tracking-wide">Sessão protegida</span>
                </div>
            </div>

            <h1 class="text-3xl lg:text-5xl font-extrabold text-slate-900 leading-tight mb-4">
                A forma mais fácil e segura de receber pagamentos
            </h1>

            <p class="text-sm lg:text-lg text-slate-700 leading-relaxed mb-8 max-w-xl">
                Toda tecnologia e infraestrutura necessária para gerenciar sua página de pagamentos com praticidade e segurança de ponta a ponta.
            </p>

            <div class="space-y-4 mb-8">
                <div class="flex items-center gap-3">
                    <div class="icon-bg"><i data-lucide="shield-alert" class="w-5 h-5"></i></div>
                    <span class="font-bold text-slate-800 text-sm lg:text-lg">Evite fraudes e golpes</span>
                </div>
                <div class="flex items-center gap-3">
                    <div class="icon-bg"><i data-lucide="lock" class="w-5 h-5"></i></div>
                    <span class="font-bold text-slate-800 text-sm lg:text-lg">Compra Protegida</span>
                </div>
            </div>
        </div>

        <div class="w-full lg:w-5/12 flex flex-col items-center pb-10">
            <div class="glass rounded-2xl shadow-xl overflow-hidden w-full max-w-md mx-auto relative z-20">
                <div class="px-6 pt-8 pb-4 text-center">
                    <h2 id="titulo-pagina" class="text-2xl font-bold text-black">Acessar sua conta</h2>
                    <div class="mt-2 h-1 w-12 bg-[#F5DE3E] mx-auto rounded-full"></div>
                </div>

                <div class="px-6 pb-8">
                    <div class="space-y-4">
                        <div>
                            <label class="text-xs font-bold text-black/70 ml-1">E-mail</label>
                            <div class="relative mt-1">
                                <i data-lucide="mail" class="absolute left-3 top-3 h-4 w-4 text-black/40"></i>
                                <input type="email" id="email" placeholder="seu@email.com" class="input-style">
                            </div>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-black/70 ml-1">Senha</label>
                            <div class="relative mt-1">
                                <i data-lucide="lock" class="absolute left-3 top-3 h-4 w-4 text-black/40"></i>
                                <input type="password" id="password" placeholder="Mínimo 6 caracteres" class="input-style">
                            </div>
                        </div>
                    </div>

                    <div id="campos-extras" class="hidden space-y-3 mt-4 pt-3 border-t border-black/10">
                        <div class="grid grid-cols-2 gap-2">
                            <div><label class="text-[10px] font-bold text-black/70 ml-1 uppercase">Nome *</label><input type="text" id="firstName" class="input-style !pl-3" placeholder="Nome"></div>
                            <div><label class="text-[10px] font-bold text-black/70 ml-1 uppercase">Sobrenome</label><input type="text" id="lastName" class="input-style !pl-3" placeholder="Sobrenome"></div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-2">
                            <div><label class="text-[10px] font-bold text-black/70 ml-1 uppercase">CPF *</label><input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" class="input-style !pl-3"></div>
                            <div><label class="text-[10px] font-bold text-black/70 ml-1 uppercase">Telefone *</label><input type="text" id="telefone" maxlength="15" placeholder="(00) 00000-0000" class="input-style !pl-3"></div>
                        </div>

                        <div><label class="text-[10px] font-bold text-black/70 ml-1 uppercase">CEP</label><input type="text" id="cep" maxlength="9" placeholder="00000-000" class="input-style !pl-3"></div>
                        
                        <input type="text" id="street" placeholder="Rua" class="input-style !pl-3">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="number" placeholder="Nº" class="input-style !pl-3">
                            <input type="text" id="neighborhood" placeholder="Bairro" class="input-style !pl-3">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="city" placeholder="Cidade" class="input-style !pl-3">
                            <input type="text" id="state" placeholder="UF" maxlength="2" class="input-style !pl-3 uppercase">
                        </div>
                    </div>

                    <button type="button" id="btn-acao" onclick="handleAuth()" class="btn-gradiente w-full mt-6 py-3 rounded-xl text-white font-bold shadow-lg">
                        Entrar
                    </button>

                    <p id="mensagem" class="text-center text-xs mt-3 font-bold min-h-[16px]"></p>

                    <div class="text-center mt-4">
                        <button type="button" onclick="toggleMode()" class="text-sm font-bold text-verde hover:underline">
                            <span id="texto-toggle">Não tem uma conta? Criar agora</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const supabaseUrl = 'https://eedegpggzooimuvytmyt.supabase.co';
        const supabaseKey = 'sb_publishable_7ib6PE-capYPhqdTrS0m2w_3d9QWE8x';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('campos-extras').classList.toggle('hidden');
            document.getElementById('titulo-pagina').innerText = isLoginMode ? "Acessar sua conta" : "Criar sua conta";
            document.getElementById('btn-acao').innerText = isLoginMode ? "Entrar" : "Criar Conta";
            document.getElementById('texto-toggle').innerText = isLoginMode ? "Não tem uma conta? Criar agora" : "Já tem uma conta? Fazer login";
        }

        document.getElementById('cpf').addEventListener('input', e => {
            let v = e.target.value.replace(/\D/g, '');
            v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            e.target.value = v;
        });

        document.getElementById('telefone').addEventListener('input', e => {
            let v = e.target.value.replace(/\D/g, '');
            v = v.replace(/^(\d{2})(\d)/g, '($1) $2').replace(/(\d)(\d{4})$/, '$1-$2');
            e.target.value = v;
        });

        document.getElementById('cep').addEventListener('input', async e => {
            let v = e.target.value.replace(/\D/g, '');
            e.target.value = v.replace(/^(\d{5})(\d)/, '$1-$2');
            if (v.length === 8) {
                const res = await fetch(`https://viacep.com.br/ws/${v}/json/`);
                const data = await res.json();
                if (!data.erro) {
                    document.getElementById('street').value = data.logradouro;
                    document.getElementById('neighborhood').value = data.bairro;
                    document.getElementById('city').value = data.localidade;
                    document.getElementById('state').value = data.uf;
                    document.getElementById('number').focus();
                }
            }
        });

        async function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-acao');
            const msg = document.getElementById('mensagem');

            if (!email || !password) { 
                msg.innerText = "Por favor, preencha e-mail e senha."; 
                msg.style.color = "red";
                return; 
            }
            
            btn.innerText = "Processando..."; btn.disabled = true;

            try {
                if (isLoginMode) {
                    const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    
                    await _supabase.from('logs_atividades').insert([{ 
                        id_cliente: data.user.id, 
                        email_cliente: email, 
                        acao: "Cliente fez login no sistema" 
                    }]);
                    
                    window.location.href = "/dashboard";

                } else {
                    const { data: authData, error: authError } = await _supabase.auth.signUp({ email, password });
                    if (authError) throw authError;

                    if (!authData || !authData.user) throw new Error("E-mail já cadastrado ou limite atingido.");

                    const { error: dbError } = await _supabase.from('clientes').insert({
                        id_auth: authData.user.id, 
                        email: email,
                        nome: document.getElementById('firstName').value,
                        sobrenome: document.getElementById('lastName').value,
                        cpf: document.getElementById('cpf').value,
                        telefone: document.getElementById('telefone').value,
                        cep: document.getElementById('cep').value,
                        rua: document.getElementById('street').value,
                        numero: document.getElementById('number').value,
                        bairro: document.getElementById('neighborhood').value,
                        cidade: document.getElementById('city').value,
                        estado: document.getElementById('state').value
                    });

                    if (dbError) throw dbError;

                    await _supabase.from('logs_atividades').insert([{ 
                        id_cliente: authData.user.id, 
                        email_cliente: email, 
                        acao: "Cliente criou uma nova conta" 
                    }]);

                    // AJUSTE: Cabeçalho 'Accept' recuperado para o FormSubmit aceitar o disparo via AJAX
                    fetch("https://formsubmit.co/ajax/lucasalvesfariaesilva@gmail.com", {
                        method: "POST",
                        headers: { 
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            _subject: "🎉 NOVO CLIENTE CADASTRADO NO SITE!",
                            Nome: document.getElementById('firstName').value + " " + document.getElementById('lastName').value,
                            Email: email,
                            CPF: document.getElementById('cpf').value,
                            Telefone: document.getElementById('telefone').value,
                            Data: new Date().toLocaleString('pt-BR')
                        })
                    }).catch(() => {});
                    
                    msg.innerText = "Cadastro realizado! Faça login agora.";
                    msg.style.color = "green";
                    toggleMode();
                }
            } catch (err) {
                msg.innerText = "Erro: " + err.message;
                msg.style.color = "red";
            } finally {
                btn.innerText = isLoginMode ? "Entrar" : "Criar Conta"; btn.disabled = false;
            }
        }
    </script>
</body>
</html>
