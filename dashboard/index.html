<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Cliente - PagBank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .active-tab { background-color: #e5e7eb; color: #000; border-right: 4px solid #00a38c; }
        .hidden-section { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">

    <div id="loading-screen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="animate-spin text-green-600 mb-4"><i data-lucide="loader-2" class="w-10 h-10"></i></div>
        <div class="text-green-600 font-bold text-xl animate-pulse">Protegendo sua conta...</div>
    </div>

    <div class="flex-1 flex flex-col md:flex-row">
        <aside class="w-full md:w-64 bg-white border-b md:border-r border-gray-200 flex-shrink-0">
            <div class="p-5 border-b border-gray-100 flex items-center justify-center h-20">
                <img src="../assets/logo.png" alt="Logo" class="h-8 w-auto object-contain">
            </div>
            <nav class="p-4 space-y-2">
                <button onclick="mudarAba('painel')" id="btn-painel" class="w-full flex items-center gap-3 px-4 py-3 text-sm rounded-lg hover:bg-gray-100 active-tab"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> Início</button>
                <button onclick="mudarAba('pedidos')" id="btn-pedidos" class="w-full flex items-center gap-3 px-4 py-3 text-sm rounded-lg hover:bg-gray-100"><i data-lucide="package" class="w-4 h-4"></i> Meus Pedidos</button>
                <button onclick="mudarAba('dados')" id="btn-dados" class="w-full flex items-center gap-3 px-4 py-3 text-sm rounded-lg hover:bg-gray-100"><i data-lucide="user" class="w-4 h-4"></i> Meus Dados</button>
                <button onclick="sair()" class="w-full flex items-center gap-3 px-4 py-3 text-sm text-red-600 rounded-lg hover:bg-red-50 mt-4 border-t pt-4"><i data-lucide="log-out" class="w-4 h-4"></i> Sair</button>
            </nav>
        </aside>

        <main class="flex-1 p-5 md:p-10 pb-24">
            <div class="flex justify-between items-center mb-8 gap-4 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div class="truncate">
                    <h1 class="text-xl font-bold text-gray-900">Olá, <span id="nome-usuario" class="capitalize">Visitante</span></h1>
                    <p class="text-gray-500 text-xs">Bem-vindo à sua área segura</p>
                </div>
                <div class="text-xs text-gray-500 bg-gray-100 px-4 py-2 rounded-full border truncate" id="email-usuario">...</div>
            </div>

            <div id="sec-painel" class="fade-in space-y-6">
                <div class="w-full bg-[#F5DE3E] rounded-2xl flex flex-col-reverse md:flex-row items-center overflow-hidden shadow-lg min-h-[180px]">
                    <div class="flex-shrink-0 pt-6 px-6 md:pl-10"><img src="../assets/banner-promo.png" alt="Promo" class="h-44 md:h-52 object-contain"></div>
                    <div class="flex-1 p-8 text-center md:text-left"><h2 class="text-2xl md:text-3xl font-extrabold text-slate-950 mb-4">Venda mais, pagando menos taxa.</h2><p class="text-slate-900 text-sm font-medium opacity-90">Planos exclusivos para o seu faturamento.</p></div>
                </div>
            </div>

            <div id="sec-pedidos" class="hidden-section fade-in space-y-6">
                <h2 class="text-xl font-bold flex items-center gap-3"><i data-lucide="package" class="w-6 h-6 text-green-600"></i> Histórico de Pedidos</h2>
                <div id="lista-vendas-moderna" class="grid grid-cols-1 lg:grid-cols-2 gap-5"></div>
            </div>

            </main>
    </div>

    <script>
        lucide.createIcons();
        const supabaseUrl = 'https://eedegpggzooimuvytmyt.supabase.co'
        const supabaseKey = 'sb_publishable_7ib6PE-capYPhqdTrS0m2w_3d9QWE8x'
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey)
        let clienteLogado = null;

        async function registrarAtividadeCliente(acao) {
            if (!clienteLogado) return;
            try { await _supabase.from('logs_atividades').insert([{ id_cliente: clienteLogado.id, email_cliente: clienteLogado.email, acao: acao }]); } catch (e) {}
        }

        async function initDashboard() {
            try {
                const { data, error } = await _supabase.auth.getUser();
                if (error || !data?.user) { window.location.href = "/minha-conta"; return; }
                clienteLogado = data.user;
                document.getElementById('email-usuario').innerText = clienteLogado.email;
                carregarVendasModernas(clienteLogado.id);
                registrarAtividadeCliente('Cliente acessou o Dashboard');
                document.getElementById('loading-screen').classList.add('hidden');
            } catch (err) { window.location.href = "/minha-conta"; }
        }
        initDashboard();

        function mudarAba(aba) {
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab'));
            document.getElementById('btn-' + (aba === 'reembolso' ? 'painel' : aba)).classList.add('active-tab');
            document.querySelectorAll('main > div').forEach(s => s.classList.add('hidden-section'));
            document.getElementById('sec-' + aba).classList.remove('hidden-section');
            registrarAtividadeCliente('Cliente clicou na aba ' + aba);
        }

        async function carregarVendasModernas(userId) {
            const container = document.getElementById('lista-vendas-moderna');
            const { data } = await _supabase.from('vendas').select('*').eq('email_cliente', userId).order('id', { ascending: false });
            if (!data || data.length === 0) { container.innerHTML = '<p class="p-10 text-center text-gray-400">Nenhum pedido encontrado.</p>'; return; }

            container.innerHTML = data.map(v => {
                const isPago = v.status === 'Pago' || v.status === 'Aprovado';
                const statusBadge = isPago 
                    ? `<span class="bg-green-50 text-green-700 px-2 py-1 rounded-full text-[10px] font-bold border border-green-100 shrink-0"><i data-lucide="check" class="w-3 h-3 inline"></i> Pago</span>`
                    : `<span class="bg-yellow-50 text-yellow-800 px-2 py-1 rounded-full text-[10px] font-bold border border-yellow-100 shrink-0"><i data-lucide="clock" class="w-3 h-3 inline"></i> Aguardando</span>`;
                
                const btnHtml = isPago ? `<span class="text-[10px] text-gray-400 italic">Pagamento Protegido</span>` : `<button onclick="irParaCheckout('${v.id}')" class="bg-green-600 text-white px-5 py-2 rounded-xl text-xs font-bold hover:bg-green-700 transition">Pagar agora</button>`;

                return `<div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm flex flex-col gap-4 overflow-hidden relative">
                    <div class="flex items-start justify-between gap-2 border-b border-gray-50 pb-3">
                        <div class="truncate"><h3 class="text-sm font-extrabold text-gray-900 truncate capitalize">${v.produto}</h3><p class="text-[9px] font-mono text-gray-400">#${v.id}</p></div>
                        ${statusBadge}
                    </div>
                    <div class="flex items-center justify-between gap-3 bg-gray-50 p-3 rounded-xl">
                        <div><p class="text-xl font-black text-green-600">R$ ${v.valor}</p></div>
                        ${btnHtml}
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        }

        window.irParaCheckout = async function(id) { await registrarAtividadeCliente('cliente clicou em pagar'); window.location.href = `/checkout?id=${id}`; }
        async function sair() { await _supabase.auth.signOut(); window.location.href = "/minha-conta"; }
    </script>
</body>
</html>
